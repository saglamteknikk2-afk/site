<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">Klima servisi</title><desc id="desc">Duvara monte klima iç ünitesi ve dış ünite, temiz hava çizgileri</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f4eb"/><stop offset="1" stop-color="#e8ebdf"/></linearGradient>
  <linearGradient id="indoor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset=".62" stop-color="#f2f6ed"/><stop offset="1" stop-color="#c9d7ca"/></linearGradient>
  <linearGradient id="outdoor" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#fbfcf7"/><stop offset="1" stop-color="#cedaca"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<rect width="800" height="520" fill="url(#wall)"/>
<path d="M74 433H730" stroke="#ccd7c8" stroke-width="2"/>
