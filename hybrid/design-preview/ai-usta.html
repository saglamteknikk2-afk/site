gin:7px 0 0}.footer{position:sticky;bottom:0;z-index:4;background:#f7f5edf7;border-top:1px solid var(--line);padding:15px 30px max(16px,env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.footer-inner{display:flex;gap:12px;align-items:center}.back{border:1px solid var(--line);background:var(--white);padding:14px 18px;border-radius:8px;color:var(--green);min-height:51px;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:8px}.primary,.secondary{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 19px;min-height:51px;border:1px solid var(--green);border-radius:8px;font-size:14px;font-weight:600}.primary{background:var(--green);color:#fffdf4;flex:1}.primary span{font-size:21px;font-weight:350}.secondary{background:var(--sage);color:var(--green);border-color:#c0cfb6;flex:1;justify-content:center}.footer-help{font-size:10px;color:var(--muted);margin-top:9px;line-height:1.5;text-align:center}.landing-footer{font-size:11px;text-align:center;line-height:1.7;color:var(--mid);padding:18px 30px 22px}.landing-footer strong{font-weight:600}.demo-sheet{border:1px solid var(--line);border-radius:17px;background:var(--white);color:var(--green);width:min(calc(100% - 28px),480px);padding:27px;box-shadow:0 16px 70px #15392b33;max-height:calc(100dvh - 28px);overflow:auto}.demo-sheet::backdrop{background:#15392ba8;backdrop-filter:blur(4px)}.sheet-top{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:23px}.sheet-top h2{font-size:30px;margin-bottom:0}.sheet-close{border:1px solid var(--line);color:var(--green);background:var(--paper);border-radius:50%;width:34px;height:34px;font-size:21px;flex-shrink:0}.demo-sheet p{font-size:14px;line-height:1.75;color:var(--mid)}.demo-sheet .primary{width:100%;margin-top:24px;justify-content:center}.demo-sheet .number{font-size:25px;font-weight:600;letter-spacing:-.03em;color:var(--green);margin-top:17px}.sheet-badge{font-size:10px;display:inline-block;letter-spacin <body>
<div class="shell" id="app">
  <header class="top">
    <div class="brand-row"><div class="brand"><img src="../assets/brand/logo-ribbon.webp" alt="" width="28" height="36"><div><strong>SAĞLAM <span>TEKNİK</span></strong><small>Isıtma &amp; Soğutma Teknolojileri</small></div></div><button class="exit" id="exit" type="button" aria-label="Akıştan çık, cihaz seçimine dön"><span class="exit-label">Çıkış</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
    <div class="preview-note">Tasarım önizlemesi · Bilgiler gönderilmez</div>
  </header>
  <main id="main"></main>
  <footer class="footer" id="footer" hidden></footer>
  <div class="landing-footer" id="landingFooter"><strong>Birlikte netleştirelim.</strong><br>Ön bilgi verir; yerinde teknik incelemenin yerine geçmez.</div>
</div>
<dialog class="demo-sheet" id="demoSheet" aria-labelledby="sheetTitle"><div class="sheet-badge">TASARIM ÖNİZLEMESİ</div><div class="sheet-top"><h2 id="sheetTitle"></h2><button class="sheet-close" id="sheetClose" type="button" aria-label="Pencereyi kapat">×</button></div><div id="sheetContent"></div><button type="button" class="primary" id="sheetReturn">Akışa dön</button></dialog>
<noscript><p style="padding:24px">Etkileşimli tasarım önizlemesi için JavaScript'i açın. Bu sayfa gerçek arıza sorgusu veya servis kaydı göndermez.</p></noscript>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={kombi:'<rect x="11" y="4" width="22" height="30" rx="3"/><rect x="16" y="10" width="12" height="8" rx="1"/><path d="M16 25h12m-11 9v6m10-6v6"/>',klima:'<rect x="4" y="8" width="36" height="18" rx="3"/><path d="M8 20h28m-7-7h5M12 31v6m10-6v9m10-9v6"/>',petek:'<rect x="4" y="10" width="36" height="25" rx="2"/><path d="M11 14v17m7-17v17m8-17v17m7-17v17M8 35v5m28-5v5"/>',spark:'<path d="M22 4v36M4 22h36M9 9l26 26M35 9 9 35"/>',shield:'<path d="M22 4 7 10v12c0 10 15 18 15 18s15-8 15-18V10L22 4Z"/><path d="m15 22 5 5 10-11"/>',reset:'<path d="M33 15a14 14 0 1 0 3 16M34 5v12H22"/>',check:'<circle cx="22" cy="22" r="17"/><path d="m13 22 6 6 13-14"/>'};
const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.spark}</svg>`;
const devices=[['kombi','Kombi','Isıtma ve sıcak su'],['klima','Klima','Isıtma ve soğutma'],['petek','Petek & Tesisat','Radyatör ve tesisat']];
const issues={kombi:['Petekler ısınmıyor','Sıcak su sorunu','Basınç değişiyor','Su akıtıyor','Hata kodu var','Patlamalı ateşleme'],klima:['Soğutmuyor','Isıtmıyor','Su damlatıyor','Sesli çalışıyor','Buzlanıyor','Hata kodu var'],petek:['Petekler soğuk','Kısmen ısınıyor','Su sızdırıyor','Ses geliyor','Bakım istiyorum','Diğer bir sorun']};
const modelNames={Vaillant:['ecoTEC pro','ecoTEC plus','ecoTEC pure','ecoTEC intro','turboTEC'],Baymak:['Duo Tec','Lambert LPY','Dolcevita DPY'],Buderus:['Logamax plus GB122i','Logamax plus GB062'],ECA:['Proteus Premix','Confeo Premix'],Bosch:['Condens 2200i W','Condens 2500 W'],Demirdöküm:['Nitromix','Atromix']};
const blank=()=>({step:0,device:'',symptom:'',brand:'',model:'',custom:false,code:'',detail:''});let state=blank();
const deviceName=()=>devices.find(d=>d[0]===state.device)?.[1]||'';
const dangerous=()=>/patlama|patlamal|sert\s*(vuruntu|ateşleme)|gaz\s*koku|gaz\s*kokusu|yangın|duman/i.test(state.symptom+' '+state.detail);
function go(step,push=true){state.step=step;if(push)history.pushState({demoStep:step},'',step?'#adim-'+step:'#baslangic');render();window.scrollTo({top:0,behavior:'instant'});requestAnimationFrame(()=>{const target=step===0?document.querySelector(`[data-device="${state.device||'kombi'}"]`):$('question');target?.focus({preventScroll:true});});}
function progress(){const steps=state.device==='petek'?[[1,'Belirti'],[3,'Sonuç']]:[[1,'Belirti'],[2,'Cihaz bilgisi'],[3,'Sonuç']];return `<div class="progress-wrap"><div class="step-top"><div class="step-context"><span class="context-dot"></span>${esc(deviceName())} · AI Usta</div><button type="button" class="reset" id="reset">${icon('reset')}Baştan başla</button></div><nav class="steps" style="grid-template-columns:repeat(${steps.length},1fr)" aria-label="Arıza sorgulama adımları">${steps.map(([step,label],i)=>`<div class="step-item ${state.step===step?'active':state.step>step?'done':''}"${state.step===step?' aria-current="step"':''}><span class="n">${state.step>step?'✓':i+1}</span>${label}</div>`).join('')}</nav></div>`;}
function render(){
  $('footer').hidden=state.step===0;$('landingFooter').hidden=state.step!==0;$('exit').hidden=state.step===0;
  let body='';
  if(state.step===0){body=`<div class="welcome-top"><div><p class="eyebrow">Sağlam Teknik AI Usta</p><h1 id="question" tabindex="-1">Neye birlikte<br>bakalım?</h1></div><div class="usta-mark">${icon('spark')}</div></div><p class="sub">Cihazınızı seçin. Sorunu adım adım netleştirelim.</p><div class="devices">${devices.map(([key,name,sub])=>`<button type="button" class="device" data-device="${key}"><span class="icon">${icon(key)}</span><span><b>${name}</b><small>${sub}</small></span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button>`).join('')}</div><p class="welcome-note">${icon('shield')}<span>Yazmak veya model bilmek zorunlu değil.<br>Her ekranda yalnızca bir sonraki adım var.</span></p>`;}
  else if(state.step===1){body=progress()+`<h2 id="question" tabindex="-1">Ne sorun yaşıyorsunuz?</h2><p class="sub">Bir belirti seçin. İsterseniz kendi cümlenizle anlatın.</p><div class="symptoms">${issues[state.device].map(item=>`<button type="button" class="symptom" data-symptom="${esc(item)}" aria-pressed="${state.symptom===item}">${esc(item)}</button>`).join('')}</div><details class="text-option"${state.detail?' open':''}><summary>Kendim anlatmak istiyorum <span>(isteğe bağlı)</span></summary><label class="field"><span>Arızanızı kısaca yazın</span><textarea id="description" placeholder="Örn. Sıcak su açınca bir süre sonra soğuyor." maxlength="700">${esc(state.detail)}</textarea></label></details><p class="micro-note">Bu sayfa tasarım denemesidir; gerçek bir AI sorgusu gönderilmez.</p>`;}
  else if(state.step===2){const brands=state.device==='klima'?['Arçelik','Beko','Daikin','Mitsubishi Electric','Samsung','LG']:Object.keys(modelNames);body=progress()+`<h2 id="question" tabindex="-1">Cihazınızı tanıyalım.</h2><p class="sub">Bildiğiniz kadarını seçin. Hepsini boş bırakabilirsiniz.</p><div class="fields-grid"><label class="field"><span>Marka <em>· isteğe bağlı</em></span><select id="brand"><option value="">Markayı bilmiyorum</option>${brands.map(b=>`<option${state.brand===b?' selected':''}>${esc(b)}</option>`).join('')}</select></label><div><label class="field"><span>Model <em>· isteğe bağlı</em></span>${state.custom?`<input id="customModel" value="${esc(state.model)}" maxlength="100" placeholder="Model adını yazabilirsiniz">`:`<select id="model"><option value="">Modelimi bilmiyorum</option>${(modelNames[state.brand]||[]).map(m=>`<option${state.model===m?' selected':''}>${esc(m)}</option>`).join('')}</select>`}</label><button type="button" class="model-link" id="writeModel">${state.custom?'← Model listesini göster':'Modelim listede yok, yazayım'}</button></div></div><details class="optional"${state.code?' open':''}><summary>Ekranda hata kodu var <span>(isteğe bağlı)</span></summary><label class="field"><span>Gördüğünüz kod</span><input id="code" value="${esc(state.code)}" maxlength="35" autocomplete="off" placeholder="Örn. F22 veya E01"></label></details><p class="soft-note">${icon('check')}Modeli bilmiyorsanız da ilk bilgiye geçebilirsiniz.</p><p class="micro-note">Önizlemede örnek model adları gösterilir. Model seçimi kesin arıza teşhisi sağlamaz.</p>`;}
  else{const danger=dangerous();body=progress()+`<div class="result-tag">${icon(danger?'shield':'check')}${danger?'Öncelikli güvenlik bilgisi':'Örnek ilk yönlendirme'}</div><h2 id="question" tabindex="-1">${danger?'Önce güvenliğiniz.':'İlk bilginiz hazır.'}</h2><div class="chosen"><span class="chip">${esc(deviceName())}</span>${state.symptom?`<span class="chip">${esc(state.symptom)}</span>`:''}${state.brand?`<span class="chip">${esc(state.brand)}</span>`:''}</div><section class="result-card${danger?' danger':''}" aria-labelledby="resultHeading"><h3 class="small-title" id="resultHeading">${danger?'Cihazı yeniden denemeyin':'Neyi kontrol ettirmeli?'}</h3><p>${danger?'Patlamalı veya sert ateşleme, yanma ile ilgili bir sorunun belirtisi olabilir. Cihazı yeniden ateşlemeyin veya resetlemeyin; kapağını açmayın. Gaz kokusu varsa elektrik düğmelerine dokunmadan güvenli alana geçin ve dışarıdan 187 Doğal Gaz Acil hattını arayın. Duman veya yangın varsa güvenli alandan 112’yi arayın.':normalResult()}</p></section><p class="next-note">${danger?'Cihazı kullanmadan önce yetkin servis kontrolü gerekir.':'Kesin teşhis için yerinde kontrol gerekir. İsterseniz seçtiğiniz bilgilerle ustamıza ulaşın.'}</p><details class="optional"><summary>Seçimlerimi görüntüle</summary><div class="result-context"><p><strong>Cihaz:</strong> ${esc(deviceName())}</p><p><strong>Belirti:</strong> ${esc(state.symptom||'Henüz seçilmedi')}</p><p><strong>Marka / model:</strong> ${esc([state.brand,state.model].filter(Boolean).join(' · ')||'Bilmiyorum')}</p>${state.code?`<p><strong>Kod:</strong> ${esc(state.code)}</p>`:''}${state.detail?`<p><strong>Anlatımınız:</strong> ${esc(state.detail)}</p>`:''}</div></details><p class="micro-note">Bu, tasarım için hazırlanmış örnek bir sonuçtur. Gerçek AI değerlendirmesi veya servis kaydı oluşturulmaz.</p>`;}
  $('main').innerHTML=`<div class="stage">${body}</div>`;
  $('footer').innerHTML=state.step===3?`<div class="footer-inner result-actions"><button type="button" class="back" id="back" aria-label="Önceki adıma geri dön">← Geri</button><button type="button" class="primary" id="call">Ustamızı ara <span aria-hidden="true"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button><button type="button" class="secondary" id="ticket">Servis talep et</button></div><div class="footer-help">Önizleme · Düğmeler gerçek arama veya kayıt başlatmaz.</div>`:`<div class="footer-inner"><button type="button" class="back" id="back">← Geri</button><button type="button" class="primary" id="next">${state.step===1?'Devam et':'Arızamı bul'} <span aria-hidden="true">→</span></button></div><div class="footer-help">${state.step===1?'Yazmadan da ilerleyebilirsiniz.':'Marka ve model seçmek zorunlu değil.'}</div>`;
  bind();
}
function normalResult(){if(state.code)return 'Hata kodlarının anlamı modele göre değişebilir. Kodun tamamını ve ne zaman çıktığını not edin. Modelinize ait üretici belgesi doğrulanmadan bir parça arızası söylemek doğru olmaz. Kapağı açmadan servis kontrolü planlayabilirsiniz.';if(/su (akıt|damla|sız)/i.test(state.symptom))return 'Sızıntının nereden geldiği ve hangi kullanım sırasında oluştuğu önemlidir. Güvenli bir mesafeden gözlemleyin; cihazın kapağını açmayın veya elektrikli bölümlerine dokunmayın. Ustamız kaynağı yerinde kontrol edebilir.';if(state.device==='klima')return 'Seçtiğiniz belirti tek başına parça arızasını göstermez. Hangi çalışma modunda ve ne zamandır oluştuğunu not edin. Soğutucu akışkan veya elektrik devresine müdahale etmeden servis kontrolü planlayabilirsiniz.';if(state.device==='petek')return 'Sorunun tek petekte mi, birkaç petekte mi yoksa tüm evde mi olduğu değerlendirmeyi değiştirir. Bu bilgiyi ustamızla paylaşın. Tesisatı sökmeden ve su boşaltmadan yerinde kontrol planlayabilirsiniz.';return 'Sorunun yalnızca sıcak suda mı, ısıtmada mı yoksa ikisinde birden mi oluştuğu önemlidir. Ekranda kod varsa tamamını not edin. Yalnızca belirtiden kesin parça arızası söylenemez; ustamızla kontrol planlayabilirsiniz.';}
function bind(){
 document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{state={...blank(),device:b.dataset.device};go(1);});
 document.querySelectorAll('[data-symptom]').forEach(b=>b.onclick=()=>{state.symptom=b.dataset.symptom;document.querySelectorAll('[data-symptom]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(dangerous())go(3);});
 if($('reset'))$('reset').onclick=()=>{state=blank();go(0);};
 if($('description'))$('description').oninput=e=>{state.detail=e.target.value;};
 if($('brand'))$('brand').onchange=e=>{state.brand=e.target.value;state.model='';state.custom=false;render();$('brand')?.focus({preventScroll:true});};
 if($('model'))$('model').onchange=e=>{state.model=e.target.value;};
 if($('customModel'))$('customModel').oninput=e=>{state.model=e.target.value;};
 if($('writeModel'))$('writeModel').onclick=()=>{state.custom=!state.custom;state.model='';const y=window.scrollY;render();window.scrollTo(0,y);(state.custom?$('customModel'):$('model'))?.focus({preventScroll:true});};
 if($('code'))$('code').oninput=e=>{state.code=e.target.value;};
 if($('back'))$('back').onclick=()=>go(state.step===3&&(dangerous()||state.device==='petek')?1:Math.max(0,state.step-1));
 if($('next'))$('next').onclick=()=>go(state.step===1&&(dangerous()||state.device==='petek')?3:state.step+1);
 if($('call'))$('call').onclick=()=>sheet('call');if($('ticket'))$('ticket').onclick=()=>sheet('ticket');
}
function sheet(type){$('sheetTitle').textContent=type==='call'?'Ustamız bir telefon uzakta.':'Bilgilerinizle devam edin.';$('sheetContent').innerHTML=type==='call'?'<p>Canlı sistemde bu düğme servis hattını arar. Bu tasarım denemesinde telefon araması başlatılmaz.</p><p class="number">0534 622 55 15</p>':`<p>Canlı sistemde servis formu seçtiğiniz cihaz ve belirtiyle açılır. Adres ve iletişim bilgileri sonraki adımda alınır.</p><div class="chosen"><span class="chip">${esc(deviceName())}</span>${state.symptom?`<span class="chip">${esc(state.symptom)}</span>`:''}</div><p>Bu önizleme kişisel bilgi toplamaz ve Telegram’a mesaj göndermez.</p>`;$('demoSheet').showModal();}
$('exit').onclick=()=>go(0);$('sheetClose').onclick=()=> $('demoSheet').close();$('sheetReturn').onclick=()=> $('demoSheet').close();$('demoSheet').addEventListener('click',e=>{if(e.target===$('demoSheet')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('demoSheet').open&&state.step){e.preventDefault();go(0);}});
window.addEventListener('popstate',e=>{state.step=state.device?Math.min(3,Math.max(0,e.state?.demoStep||0)):0;render();window.scrollTo(0,0);});
history.replaceState({demoStep:0},'','#baslangic');render();
})();
</script>
</body>
</html>
