name: Sağlam Teknik — Premium Test Ön İzlemesi

on:
  push:
    branches: [main]
    paths:
      - 'preview-parts/**'
      - 'overrides/**'
      - 'components/**'
      - 'templates/**'
      - 'server/**'
      - 'private-examples/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'preview-parts/**'
      - 'overrides/**'
      - 'components/**'
      - 'templates/**'
      - 'server/**'
      - 'private-examples/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      production_package:
        description: 'Üretim ZIP taslağı oluştur (ana siteye yüklemez)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: saglam-test-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_sqlite, mbstring
          coverage: none
      - name: Derleme ayrımı ve arşiv bütünlüğünü test et
        run: |
          python scripts/model_directory.py --check
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript ve PHP sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail
          find overrides scripts tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check
          find server -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Düzenlenebilir kaynaklardan güvenli Pages ön izlemesini derle
        run: |
          python scripts/build_site.py --mode preview --output _site --base-path /site
          python scripts/check_site.py _site --mode preview --report build/preview-check.json
      - name: Üretim SEO ve içerik bütünlüğünü doğrula (canlı yayın yok)
        run: |
          python scripts/build_site.py --mode production --output build/production
          python scripts/check_site.py build/production --mode production --report build/production-check.json
          python scripts/audit_content.py build/production --strict --report build/content-audit.json
          python scripts/internal_links.py build/production --report build/crawl-check.json --check
          php tests/business-runtime.php
          php tests/priority-service.php
          php tests/review-moderation.php
          php tests/moderation-http.php build/production
          php tests/service-operations.php
          php tests/notification-reports.php build/production
          php tests/notification-dispatch.php
          php tests/config-notification-failure.php
          php tests/storage.php
          php tests/analytics.php
          php tests/installation-diagnostics.php
          php tests/fault-catalog.php
          python tests/catalog_acceptance.py build/production
          php tests/brand_registry.php build/production
          php tests/backend-http.php build/production
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerçek tarayıcı bağlantı testini hazırla
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          SAGLAM_CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$SAGLAM_CHROME_BIN" ]; then
            printf 'CHROMIUM_BIN=%s\n' "$SAGLAM_CHROME_BIN" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
            node -e 'process.stdout.write("CHROMIUM_BIN="+require("playwright").chromium.executablePath()+"\n")' >> "$GITHUB_ENV"
          fi
      - name: Sayfalardan AI Usta ve model bağlantılarını gerçekten tıkla
        run: python scripts/run_browser_acceptance.py
      - name: Derleme kontrol raporları
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-report
          path: |
            build/browser-acceptance-run.json
            build/browser-acceptance/*.log
            build/preview-check.json
            build/production-check.json
            build/content-audit.json
            build/crawl-check.json
            build/custom-check.json
            build/qa-navigation/navigation-final.json
            build/qa/browser-smoke.json
            build/qa-model/*.json
            build/qa-interactions/interactions-final.json
            build/qa-interactions-extras/interactions-final.json
            build/editorial-links-browser.json
            build/backend-qa/backend-browser.json
            build/backend-qa/backend-http.json
            build/qa-portable/*.json
            build/qa-master-matrix/*.json
            build/fault-lookup-report.json
            build/catalog-acceptance.json
            build/backend-qa/owner-browser.json
            build/backend-qa/priority-http.json
            build/priority-service-browser.json
            build/priority-preview-browser.json
            build/service-operations-test.json
            build/review-moderation-report.json
            build/backend-qa/moderation-http.json
            build/home-entry-reviews.json
            build/backend-qa/service-operations-browser.json
            build/priority-service-quote-*.png
            build/frontend-events-report.json
            build/qa-ticket-modal/*.json
            build/qa-ticket-modal/*.png
            build/qa-page-visual/*.json
            build/qa-page-visual/*.png
            build/qa-model-guidance/evidence/*.json
            build/qa-model-guidance/evidence/*.png
            _site/build-info.json
      - name: GitHub Pages dosyalarını hazırla
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: İsteğe bağlı üretim paketi (yayın yok)
        if: github.event_name == 'workflow_dispatch' && inputs.production_package
        run: |
          python scripts/build_site.py --mode production --output build/production
          python scripts/check_site.py build/production --mode production --report build/production-check.json
          python scripts/package_production.py build/production --output build/saglam-teknik-production-draft.zip
      - name: Üretim taslak ZIP dosyasını indirilebilir yap
        if: github.event_name == 'workflow_dispatch' && inputs.production_package
        uses: actions/upload-artifact@v4
        with:
          name: production-draft-NOT-DEPLOYED
          path: |
            build/saglam-teknik-production-draft.zip
            build/production-check.json
            templates/private/

  deploy-preview:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Yalnızca GitHub test ön izlemesini yayınla
        id: deployment
        uses: actions/deploy-pages@v4
