name: Sağlam Teknik — Krem Renkli Canlı Ön İzleme

on:
  push:
    branches: [main]
    paths:
      - 'preview-parts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saglam-test-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: GitHub depo dosyalarını getir
        uses: actions/checkout@v4

      - name: GitHub Pages ayarını hazırla
        uses: actions/configure-pages@v5

      - name: Güvenli statik arşivi oluştur
        shell: bash
        run: |
          set -euo pipefail
          test "$(find preview-parts -name 'part-*.txt' | wc -l)" -eq 43
          find preview-parts -name 'part-*.txt' -print | LC_ALL=C sort | xargs cat | tr -d '\n\r' | base64 -d > site-preview.zip
          echo '1e1af83e7bc6233f8af88f89a5873440288caed73cb4173483106f050ec5eb7b  site-preview.zip' | sha256sum -c -
          mkdir -p _site
          unzip -oq site-preview.zip -d _site
          test -s _site/index.html
          grep -qi 'noindex' _site/index.html
          test ! -f _site/api.php
          test ! -f _site/owner-admin.html
          find _site -type f \( -name 'google*.html' -o -name 'yandex_*.html' \) -delete
          # Tasarımı bozmadan yalnızca GitHub test ön izlemesinde yazıları büyüt
          cp preview-readability.css _site/assets/preview-readability.css
          find _site -maxdepth 1 -type f -name '*.html' -print0 |
            xargs -0 -r sed -i 's#</head>#<link rel="stylesheet" href="./assets/preview-readability.css?v=20261023a"></head>#'
          # SADECE GITHUB TEST SÜRÜMÜ: görünür ve model seçmeli iyileştirmeler
          test -s preview-enhancements.css
          test -s preview-enhancements.js
          node --check preview-enhancements.js
          cp preview-enhancements.css _site/assets/preview-enhancements.css
          cp preview-enhancements.js _site/assets/preview-enhancements.js
          for art in klima-servisi petek-temizligi kombi-servisi; do
            test -s "preview-art/$art.svg"
            cp "preview-art/$art.svg" "_site/assets/page-art/$art.svg"
          done
          find _site -maxdepth 1 -type f -name '*.html' -print0 |
            xargs -0 -r sed -i 's#</head>#<link rel="stylesheet" href="/site/assets/preview-enhancements.css?v=20261023b"></head>#'
          # Model seçici tarayıcıda çalışır; gerçek sırlar ve PHP içermez.
          sed -i 's#</body>#<script src="/site/assets/preview-enhancements.js?v=20261023b" defer></script></body>#' \
            _site/eca-kombi-proteus-premix-hm-tr-ariza-kodlari.html
          # Aynı resim URL'leri tarayıcı önbelleğinde kalmasın.
          for art in klima-servisi petek-temizligi kombi-servisi; do
            sed -i "s#page-art/$art.svg#page-art/$art.svg?v=20261023b#g" _site/index.html
          done
          test -s _site/assets/preview-enhancements.css
          test -s _site/assets/page-art/klima-servisi.svg
          test -s _site/assets/page-art/petek-temizligi.svg
          grep -q 'preview-enhancements.js' _site/eca-kombi-proteus-premix-hm-tr-ariza-kodlari.html
          grep -q 'preview-enhancements.css' _site/index.html
          echo 'Görsel iyileştirmeler ve model seçici yerleştirildi.'
          echo 'Güvenli statik ön izleme paketi doğrulandı.'

      - name: GitHub Pages yayını için yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Ön izlemeyi yayına al
        id: deployment
        uses: actions/deploy-pages@v4
