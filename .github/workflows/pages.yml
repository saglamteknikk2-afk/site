name: Saglam Teknik Krem Test Yayini
on:
  push:
    branches: [main]
    paths:
      - 'preview-parts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saglam-test-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4
      - name: Statik on izlemeyi olustur
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import base64, hashlib, io
          parts = sorted(Path("preview-parts").glob("chunk-*.txt"))
          assert len(parts) == 11, "Eksik test paketi parcasi"
          data64 = "".join(p.read_text("ascii").strip() for p in parts)
          assert len(data64) == 7580100, "Eksik veya fazla aktarim verisi"
          zipdata = base64.b64decode(data64, validate=True)
          assert hashlib.sha256(zipdata).hexdigest() == "1e1af83e7bc6233f8af88f89a5873440288caed73cb4173483106f050ec5eb7b", "ZIP ozeti tutmuyor"
          root = Path("_site")
          root.mkdir(exist_ok=True)
          with ZipFile(io.BytesIO(zipdata)) as z:
              assert z.testzip() is None, "ZIP dosyasi bozuk"
              for item in z.infolist():
                  p = Path(item.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise ValueError("Guvenli olmayan ZIP yolu")
                  if not item.is_dir():
                      target = root / p
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(item))
          assert (root/"index.html").is_file()
          assert "noindex" in (root/"index.html").read_text("utf-8").lower()
          assert not list(root.rglob("*.php"))
          assert not (root/"owner-admin.html").exists()
          print("Statik test paketi dogrulandi.")
          PY
      - name: GitHub Pages'i yapilandir
        uses: actions/configure-pages@v5
      - name: Statik dosyalari yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: On izlemeyi yayinla
        id: deployment
        uses: actions/deploy-pages@v4
