name: Sağlam Teknik — Krem Renkli Canlı Ön İzleme

on:
  push:
    branches: [main]
    paths:
      - 'preview-parts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saglam-test-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: GitHub depo dosyalarını getir
        uses: actions/checkout@v4

      - name: GitHub Pages ayarını hazırla
        uses: actions/configure-pages@v5

      - name: Güvenli statik arşivi oluştur
        shell: bash
        run: |
          set -euo pipefail
          test "$(find preview-parts -name 'part-*.txt' | wc -l)" -eq 43
          find preview-parts -name 'part-*.txt' -print | LC_ALL=C sort | xargs cat | tr -d '\n\r' | base64 -d > site-preview.zip
          echo '1e1af83e7bc6233f8af88f89a5873440288caed73cb4173483106f050ec5eb7b  site-preview.zip' | sha256sum -c -
          mkdir -p _site
          unzip -oq site-preview.zip -d _site
          test -s _site/index.html
          grep -qi 'noindex' _site/index.html
          test ! -f _site/api.php
          test ! -f _site/owner-admin.html
          find _site -type f \( -name 'google*.html' -o -name 'yandex_*.html' \) -delete
          echo 'Güvenli statik ön izleme paketi doğrulandı.'

      - name: GitHub Pages yayını için yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Ön izlemeyi yayına al
        id: deployment
        uses: actions/deploy-pages@v4
