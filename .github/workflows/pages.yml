name: Sağlam Teknik — Premium Test Ön İzlemesi

on:
  push:
    branches: [main]
    paths:
      - 'preview-parts/**'
      - 'overrides/**'
      - 'components/**'
      - 'templates/**'
      - 'server/**'
      - 'private-examples/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'preview-parts/**'
      - 'overrides/**'
      - 'components/**'
      - 'templates/**'
      - 'server/**'
      - 'private-examples/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      production_package:
        description: 'Üretim ZIP taslağı oluştur (ana siteye yüklemez)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: saglam-test-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derleme ayrımı ve arşiv bütünlüğünü test et
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript ve PHP sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail
          find overrides scripts -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check
          find server -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Düzenlenebilir kaynaklardan güvenli Pages ön izlemesini derle
        run: |
          python scripts/build_site.py --mode preview --output _site --base-path /site
          python scripts/check_site.py _site --mode preview --report build/preview-check.json
      - name: Üretim SEO ve içerik bütünlüğünü doğrula (canlı yayın yok)
        run: |
          python scripts/build_site.py --mode production --output build/production
          python scripts/check_site.py build/production --mode production --report build/production-check.json
          python scripts/audit_content.py build/production --strict --report build/content-audit.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerçek tarayıcı bağlantı testini hazırla
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          node -e 'process.stdout.write("CHROMIUM_BIN="+require("playwright").chromium.executablePath()+"\n")' >> "$GITHUB_ENV"
      - name: Sayfalardan AI Usta ve model bağlantılarını gerçekten tıkla
        run: |
          python scripts/build_site.py --mode preview --output build/qa-navigation/custom --base-path /qa-preview
          python scripts/check_site.py build/qa-navigation/custom --mode preview --base-path /qa-preview --report build/custom-check.json
          node tests/runtime_paths.cjs _site /site
          node tests/runtime_paths.cjs build/production /
          node tests/runtime_paths.cjs build/qa-navigation/custom /qa-preview
          node tests/navigation.cjs
          node tests/browser_smoke.cjs
      - name: Derleme kontrol raporları
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-report
          path: |
            build/preview-check.json
            build/production-check.json
            build/content-audit.json
            build/custom-check.json
            build/qa-navigation/navigation-final.json
            build/qa/browser-smoke.json
            _site/build-info.json
      - name: GitHub Pages dosyalarını hazırla
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: İsteğe bağlı üretim paketi (yayın yok)
        if: github.event_name == 'workflow_dispatch' && inputs.production_package
        run: |
          python scripts/build_site.py --mode production --output build/production
          python scripts/check_site.py build/production --mode production --report build/production-check.json
          python scripts/package_production.py build/production --output build/saglam-teknik-production-draft.zip
      - name: Üretim taslak ZIP dosyasını indirilebilir yap
        if: github.event_name == 'workflow_dispatch' && inputs.production_package
        uses: actions/upload-artifact@v4
        with:
          name: production-draft-NOT-DEPLOYED
          path: |
            build/saglam-teknik-production-draft.zip
            build/production-check.json
            templates/private/

  deploy-preview:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Yalnızca GitHub test ön izlemesini yayınla
        id: deployment
        uses: actions/deploy-pages@v4
