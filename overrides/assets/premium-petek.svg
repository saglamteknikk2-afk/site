<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">Petek ve sıcak yuva</title><desc id="desc">Beyaz kalorifer peteğinin önünde yumuşak minder üzerinde uyuyan sevimli tekir kedi</desc>
<defs>
